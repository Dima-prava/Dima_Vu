<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Изготовление прав</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      color: #000000;
    }
    .container {
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    .red-box {
      background-color: #ff4d4d;
      color: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 18px;
      line-height: 1.6;
      animation: fadeInUp 1s ease-in-out;
    }
    .blue-box {
      background-color: #4d79ff;
      color: white;
      padding: 20px;
      border-radius: 10px;
      font-size: 20px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 30px;
      animation: fadeInUp 1.5s ease-in-out;
    }
    .telegram-button {
      display: block;
      width: fit-content;
      margin: 0 auto;
      padding: 12px 24px;
      background-color: #0088cc;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      text-decoration: none;
      font-weight: bold;
      transition: background-color 0.3s ease;
      animation: fadeInUp 2s ease-in-out;
    }
    .telegram-button:hover {
      background-color: #0077b3;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 40px;
      animation: fadeInUp 2.5s ease-in-out;
    }
    .gallery img {
      width: 100%;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @media (max-width: 600px) {
      .container {
        padding: 10px;
      }
      .red-box, .blue-box {
        font-size: 16px;
        padding: 15px;
      }
      .telegram-button {
        font-size: 14px;
        padding: 10px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="red-box">
      Изготовление Водительского удостоверения<br /><br />
      Также:<br />
      - Изготовление мед справки<br />
      - Добавление категорий<br />
      - Экзамены<br />
      - Автошкола<br /><br />
      Стоимость:<br />
      A — 30.000 ₽<br />
      B — 50.000 ₽<br />
      C — 55.000 ₽<br />
      D — 60.000 ₽<br />
      T — 58.000 ₽
    </div>

    <div class="blue-box">
      TELEGRAM: @Dima_VU
    </div>

    <a href="https://t.me/Dima_VU" class="telegram-button" target="_blank">Написать в Telegram</a>

    <div class="gallery">
      <img src="photo_2025-04-14_21-01-23.jpg" alt="Водительское удостоверение 1">
      <img src="photo_2025-04-14_21-01-28.jpg" alt="Водительское удостоверение 2">
      <img src="photo_2025-04-14_21-01-33.jpg" alt="Водительское удостоверение 3">
    </div>
  </div>
</body>
</html>
